services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_VWORLD_KEY: ${VITE_VWORLD_KEY}   # 운영 빌드에 레퍼런스 VWorld 키 주입(.env에서)
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 클라이언트2: 이수건설 시흥하중(isu-hj.itu.kr). 소스는 /opt/isu-hj-dash, DB는 공유 pg의 isu-hj
  app-isuhj:
    build:
      context: /opt/isu-hj-dash
      args:
        VITE_VWORLD_KEY: ${VITE_VWORLD_KEY}
    env_file: /opt/isu-hj-dash/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
      - app-isuhj
    restart: unless-stopped
    # 갱신된 인증서를 주기적으로 반영
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped
    # 12시간마다 만료 임박 인증서 자동 갱신
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
