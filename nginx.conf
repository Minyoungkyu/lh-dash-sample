# ── CCTV HLS 스트림 업스트림(정적) ──────────────────────
# 알려진 스트림 장비를 nginx 시작 시 1회만 DNS 해석(런타임 resolver 미사용)
# → 첫 요청 콜드 DNS 지연(~5초) 제거. DDNS IP 바뀌면 nginx 재시작으로 갱신.
# 스트림 호스트 추가 시: 여기에 upstream 추가 + 아래 443 서버에 location 추가.
upstream hls_itu_smndm { server itu-smndm.iptime.org:80; }

server {
    listen 80;
    server_name namsa.itu.kr isu-hj.itu.kr;   # 두 도메인 공통(ACME + https 리다이렉트)

    # Let's Encrypt ACME 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 https로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name namsa.itu.kr;

    ssl_certificate     /etc/letsencrypt/live/namsa.itu.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namsa.itu.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # ── CCTV HLS 스트림 중계 ──────────────────────────────
    # /hls/<host>/<path> → 정적 upstream 으로 릴레이. (대시보드=HTTPS, 장비=HTTP전용/자체서명 → 서버가 중계)
    # location 정규식이 허용 호스트 화이트리스트 역할(SSRF 방지). 호스트 추가 시 upstream+location 한 쌍 추가.
    location ~ ^/hls/itu-smndm\.iptime\.org/(.*)$ {
        proxy_pass http://hls_itu_smndm/$1$is_args$args;
        proxy_set_header Host itu-smndm.iptime.org;
        proxy_http_version 1.1;
        proxy_set_header Connection close;   # keep-alive 청크 종료 지연 방지
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── 클라이언트2: 이수건설 시흥하중 (isu-hj.itu.kr → app-isuhj) ──
server {
    listen 443 ssl;
    server_name isu-hj.itu.kr;

    ssl_certificate     /etc/letsencrypt/live/isu-hj.itu.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isu-hj.itu.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # (CCTV 추가되면 여기 /hls upstream+location 추가)

    location / {
        proxy_pass http://app-isuhj:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
